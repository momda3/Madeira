name: Build Madeira for LiveContainer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Find Project and Build
        run: |
          # 自動尋找專案檔案的實際位置，避免路徑不對導致 code 66
          PROJ_PATH=$(find . -name "*.xcodeproj" -print -quit)
          echo "Found project at: $PROJ_PATH"
          
          if [ -z "$PROJ_PATH" ]; then
            echo "Error: Could not find .xcodeproj file!"
            exit 1
          fi
          
          mkdir -p build_output
          
          # 執行免簽名編譯
          xcodebuild -project "$PROJ_PATH" \
                     -scheme Madeira \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     -derivedDataPath build_output \
                     clean build

          # 自動尋找編譯編好的 .app 並打包
          APP_PATH=$(find build_output -name "Madeira.app" -type d -print -quit)
          echo "Found compiled app at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Madeira.app was not built successfully!"
            exit 1
          fi
          
          mv "$APP_PATH" ./Madeira.app

      - name: Upload Artifact (Madeira.app)
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-LiveContainer-App
          path: ./Madeira.app
